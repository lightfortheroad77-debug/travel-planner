name: Deploy to Github Pages

"on":
  push:
    branches:
      - main
    workflow_dispatch:

    permissions:
      contents: read
      pages: write
      id-token: write

concurrency:
    group: github-pages
    cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --noaudit --no-fund
  
      - name: Build website
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{vars.VIT_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{vars.VITE_SUPABASE_ANON_KEY }}
          
        - name: Upload Pages artifact
          uses: actions/upload-pages-artifact@v3
          with: 
            path: dist

deploy: 
  needs: build
  runs-on: ubuntu-latest
  environment:
    name: github-pages
    url: ${{ steps.deployment.outputs.page_url }}
  steps: 
    - name: Deploy to Github PAges
      id: deployment
      uses: actions/deploy-pages@v4
